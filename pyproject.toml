[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "environmental-data-analysis"
version = "0.1.0"
description = "Reproducible environmental data cleaning, exploration, and predictive modeling"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.scripts]
environmental-analysis = "environmental_analysis.cli:main"

[tool.setuptools.packages.find]
include = ["environmental_analysis*"]
